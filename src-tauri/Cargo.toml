[package]
name = "endfield-gacha-tui"
version = "0.1.0"
description = "Minimalist TUI-styled GUI gacha analyzer for Arknights: Endfield"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "endfield_gacha_tui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tauri = { version = "2", features = [] }
dirs = "5"
rfd = "0.15"
