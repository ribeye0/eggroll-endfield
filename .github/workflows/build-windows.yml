name: Build Windows Executable

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build Tauri Windows binary
        run: pnpm tauri build

      - name: Rename Windows executable
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $ver = $conf.version
          $src = "src-tauri/target/release/endfield-gacha-tui.exe"
          $dst = "src-tauri/target/release/EggRoll_${ver}_x64.exe"
          Copy-Item -Path $src -Destination $dst -Force

      - name: Upload Windows .exe artifact
        uses: actions/upload-artifact@v7
        with:
          name: EggRoll-windows-x64
          path: src-tauri/target/release/EggRoll_*_x64.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/EggRoll_*_x64.exe
          generate_release_notes: true
